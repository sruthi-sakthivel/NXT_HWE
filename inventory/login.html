<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in — NextSense Inventory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0F0E0C;color:#E8E6E1;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
  .card{background:#1A1815;border:1px solid #2E2B26;border-radius:12px;padding:40px;max-width:360px;text-align:center;}
  h1{font-size:18px;margin:0 0 8px;}
  p{font-size:13px;color:#B4B2A9;margin:0 0 24px;}
  .err{color:#E5734A;font-size:13px;margin-top:16px;display:none;}
  .g_id_signin_wrap{display:flex;justify-content:center;}
</style>
</head>
<body>
  <div class="card">
    <h1>Smartbuds &amp; MEU Inventory</h1>
    <p>Sign in with your NextSense Google account to continue.</p>
    <div class="g_id_signin_wrap">
      <div id="g_id_onload"
           data-client_id="863545530166-2ap7tl7cpntv0dhs95lqug5rn7tavgcj.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-hd="nextsense.io">
      </div>
      <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large"></div>
    </div>
    <div class="err" id="err"></div>
  </div>
  <script>
    function getNextPath(){
      const params = new URLSearchParams(location.search);
      const next = params.get('next');
      return next && next.startsWith('/') ? next : '/';
    }
    async function handleCredentialResponse(response){
      const errEl = document.getElementById('err');
      errEl.style.display = 'none';
      try{
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({credential: response.credential})
        });
        if(res.ok){
          location.href = getNextPath();
          return;
        }
        const data = await res.json().catch(()=>({}));
        errEl.textContent = data.error || 'Sign-in failed. Please try again.';
        errEl.style.display = 'block';
      }catch(e){
        errEl.textContent = 'Sign-in failed. Please try again.';
        errEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
