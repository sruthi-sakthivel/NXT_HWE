<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in — NextSense Inventory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0F0E0C;color:#E8E6E1;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
  .card{background:#1A1815;border:1px solid #2E2B26;border-radius:12px;padding:40px;max-width:340px;width:100%;text-align:center;box-sizing:border-box;}
  h1{font-size:18px;margin:0 0 8px;}
  p{font-size:13px;color:#B4B2A9;margin:0 0 24px;}
  input[type=password]{width:100%;box-sizing:border-box;padding:10px 12px;font-size:14px;background:#0F0E0C;border:1px solid #3A3730;border-radius:6px;color:#E8E6E1;margin-bottom:12px;}
  button{width:100%;padding:10px 12px;font-size:14px;font-weight:600;background:#4C8BF5;color:#fff;border:none;border-radius:6px;cursor:pointer;}
  button:disabled{opacity:0.6;cursor:default;}
  .err{color:#E5734A;font-size:13px;margin-top:12px;display:none;}
</style>
</head>
<body>
  <div class="card">
    <h1>Smartbuds &amp; MEU Inventory</h1>
    <p>Enter the dashboard password to continue.</p>
    <form id="form">
      <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
      <button type="submit" id="submitBtn">Sign in</button>
    </form>
    <div class="err" id="err"></div>
  </div>
  <script>
    function getNextPath(){
      const params = new URLSearchParams(location.search);
      const next = params.get('next');
      return next && next.startsWith('/') ? next : '/';
    }
    const form = document.getElementById('form');
    const errEl = document.getElementById('err');
    const submitBtn = document.getElementById('submitBtn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.style.display = 'none';
      submitBtn.disabled = true;
      try{
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({password: document.getElementById('password').value})
        });
        if(res.ok){
          location.href = getNextPath();
          return;
        }
        const data = await res.json().catch(()=>({}));
        errEl.textContent = data.error || 'Incorrect password.';
        errEl.style.display = 'block';
      }catch(err){
        errEl.textContent = 'Sign-in failed. Please try again.';
        errEl.style.display = 'block';
      }finally{
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
