name: Refresh Rush Order data

on:
  schedule:
    # 13:00 UTC = 6am PT (5am during PDT) — adjust the hour if you want a
    # different local time. GitHub Actions cron doesn't observe daylight
    # saving, so the local time will shift by an hour twice a year.
    - cron: '0 13 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull latest Rush Order stock
        env:
          RUSHORDER_EMAIL: ${{ secrets.RUSHORDER_EMAIL }}
          RUSHORDER_TOKEN: ${{ secrets.RUSHORDER_TOKEN }}
        run: node inventory/scripts/refresh.js

      - name: Commit updated data.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily Rush Order data refresh"
          file_pattern: inventory/data.json
