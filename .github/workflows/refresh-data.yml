name: Refresh Rush Order data

on:
  schedule:
    # 9:13am PDT (8:13am PST in winter) — adjust the hour if you want a
    # different local time. GitHub Actions cron doesn't observe daylight
    # saving, so the local time will shift by an hour twice a year. Offset
    # 13 minutes past the hour on purpose: GitHub's docs warn that
    # top-of-the-hour schedules (":00") hit the highest congestion and can
    # be delayed significantly.
    - cron: '13 16 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull latest Rush Order stock
        env:
          RUSHORDER_EMAIL: ${{ secrets.RUSHORDER_EMAIL }}
          RUSHORDER_TOKEN: ${{ secrets.RUSHORDER_TOKEN }}
        run: node inventory/scripts/refresh.js

      - name: Commit updated data.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily Rush Order data refresh"
          file_pattern: inventory/data.json
